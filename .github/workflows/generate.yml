name: Generate stubs
run-name: Generate ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.proto_ref || inputs.proto_ref }}

# One matrix job per language: a failing language never blocks the others.
# `publish` then opens a PR with the stubs of the languages that passed
# (main is protected), waits for it to merge and tags each passing language.
on:
  repository_dispatch:
    types: [proto_release]
  workflow_dispatch:
    inputs:
      proto_ref:
        description: proto repo release tag (e.g. v0.2.0)
        required: true
      proto_repo:
        description: owner/name of the proto repo (empty = PROTO_REPO var or huponx/protos)
        required: false
        default: ""
      langs:
        description: Languages to generate, space separated (re-run only the ones that failed)
        required: false
        default: "go java scala rust"

permissions:
  contents: read

concurrency:
  group: generate
  cancel-in-progress: false

env:
  # Keep in sync with protos/.github/workflows/ci.yml. Bump in its own PR.
  BUF_VERSION: "1.75.0"

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proto_ref: ${{ steps.meta.outputs.proto_ref }}
      proto_repo: ${{ steps.meta.outputs.proto_repo }}
      langs: ${{ steps.meta.outputs.langs }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Resolve inputs
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.client_payload.proto_ref }}
          DISPATCH_REPO: ${{ github.event.client_payload.proto_repo }}
          INPUT_REF: ${{ inputs.proto_ref }}
          INPUT_REPO: ${{ inputs.proto_repo }}
          INPUT_LANGS: ${{ inputs.langs }}
          REPO_VAR: ${{ vars.PROTO_REPO }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Stubs are committed through PRs against the default branch.
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "::error::run this workflow on ${DEFAULT_BRANCH}, not ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [ "${EVENT}" = "repository_dispatch" ]; then
            ref="${DISPATCH_REF}"
            repo="${DISPATCH_REPO}"
          else
            ref="${INPUT_REF}"
            repo="${INPUT_REPO}"
          fi
          repo="${repo:-${REPO_VAR:-huponx/protos}}"

          if ! [[ "${ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::proto_ref '${ref}' must be a release tag like v1.2.3"
            exit 1
          fi
          if ! [[ "${repo}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::proto_repo '${repo}' must look like owner/name"
            exit 1
          fi

          # To add a language: add it here, add protos/buf.gen.<lang>.yaml, a
          # build file under <lang>/, and a case in huponx/actions lang-setup + lang-compile.
          all="go java scala rust"
          wanted="${INPUT_LANGS:-${all}}"
          [ "${EVENT}" = "repository_dispatch" ] && wanted="${all}"
          langs=""
          for l in ${wanted}; do
            case " ${all} " in
              *" ${l} "*) langs="${langs} ${l}" ;;
              *) echo "::error::unknown language '${l}' (known: ${all})"; exit 1 ;;
            esac
          done
          langs="${langs# }"
          # shellcheck disable=SC2086
          matrix="$(printf '%s\n' ${langs} | jq -R . | jq -sc '{lang: .}')"

          {
            echo "proto_ref=${ref}"
            echo "proto_repo=${repo}"
            echo "langs=${langs}"
            echo "matrix=${matrix}"
          } >> "${GITHUB_OUTPUT}"

  generate:
    name: generate (${{ matrix.lang }})
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    env:
      PROTO_REF: ${{ needs.meta.outputs.proto_ref }}
      LANG_NAME: ${{ matrix.lang }}
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Checkout proto
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.meta.outputs.proto_repo }}
          ref: ${{ needs.meta.outputs.proto_ref }}
          path: proto-src
          # A private proto repo needs a read token; public repos fall back to the default.
          token: ${{ secrets.PROTO_READ_TOKEN || github.token }}

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # The build files are committed by hand; only the stubs are generated.
      - name: Check project scaffold
        run: |
          set -euo pipefail
          case "${LANG_NAME}" in
            go) marker=go/go.mod ;;
            java) marker=java/pom.xml ;;
            scala) marker=scala/build.sbt ;;
            rust) marker=rust/Cargo.toml ;;
            *) echo "::error::unknown language ${LANG_NAME}"; exit 1 ;;
          esac
          if [ ! -f "${marker}" ]; then
            echo "::error::${marker} is missing in protogen. Commit the ${LANG_NAME} project files (see README: Add a language) before generating."
            exit 1
          fi

      - uses: huponx/actions/.github/actions/lang-setup@v1
        with:
          lang: ${{ matrix.lang }}
          root: ${{ matrix.lang }}

      # ScalaPB has no remote plugin on the BSR: install protoc-gen-scala (needs the JDK from lang-setup).
      - name: Install protoc-gen-scala
        if: matrix.lang == 'scala'
        run: |
          set -euo pipefail
          bash proto-src/scripts/install-scalapb.sh "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Generate stubs
        id: gen
        env:
          PROTO_DIR: ${{ github.workspace }}/proto-src
          PROTOGEN_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash proto-src/scripts/generate.sh "${LANG_NAME}"
          if [ "${LANG_NAME}" = "go" ]; then
            # Module path follows the major version: go/ (v0, v1) or go/vN/ (N >= 2).
            . proto-src/scripts/lib.sh
            go_layout "${PROTO_REF}"
            cd "${GO_DIR}"
            if [ -f go.mod ]; then
              go mod edit -module "${GO_MODULE}"
            else
              go mod init "${GO_MODULE}"
            fi
          fi

      - name: Compile
        id: compile
        uses: huponx/actions/.github/actions/lang-compile@v1
        with:
          lang: ${{ matrix.lang }}
          root: ${{ matrix.lang }}
          tidy: "true"

      - name: Package stubs
        run: |
          set -euo pipefail
          . proto-src/scripts/lib.sh
          if [ "${LANG_NAME}" = "go" ]; then
            go_layout "${PROTO_REF}"
          fi
          list_stub_files . "${LANG_NAME}" > stubs.list
          if [ ! -s stubs.list ]; then
            echo "::error::no stub files produced for ${LANG_NAME}"
            exit 1
          fi
          tar -cf stubs.tar -T stubs.list

      - uses: actions/upload-artifact@v6
        with:
          name: stubs-${{ matrix.lang }}
          path: stubs.tar
          if-no-files-found: error
          retention-days: 7

      - name: Record result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GEN_OUTCOME: ${{ steps.gen.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          set -euo pipefail
          status=success
          note=""
          if [ "${JOB_STATUS}" != "success" ]; then
            status=failure
            if [ "${GEN_OUTCOME}" != "success" ]; then
              note="generate step ${GEN_OUTCOME}"
            elif [ "${COMPILE_OUTCOME}" != "success" ]; then
              note="compile step ${COMPILE_OUTCOME}"
            else
              note="job ${JOB_STATUS}"
            fi
            echo "::error title=${LANG_NAME}::${LANG_NAME} failed (${note})"
          fi
          mkdir -p result
          jq -n --arg lang "${LANG_NAME}" --arg status "${status}" --arg note "${note}" \
            '{lang: $lang, status: $status, note: $note}' > result/result.json
          {
            echo "### ${LANG_NAME}: ${status}"
            [ -n "${note}" ] && echo "${note}"
          } >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: result-${{ matrix.lang }}
          path: result/result.json
          retention-days: 7

  publish:
    needs: [meta, generate]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error::secret BOT_TOKEN is not set (needed to open PRs that trigger checks and to push tags)"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.BOT_TOKEN }}

      - name: Checkout proto
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.meta.outputs.proto_repo }}
          ref: ${{ needs.meta.outputs.proto_ref }}
          path: proto-src
          token: ${{ secrets.PROTO_READ_TOKEN || github.token }}

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish (PR, wait for merge, tag)
        id: publish
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          PROTO_REF: ${{ needs.meta.outputs.proto_ref }}
          PROTO_REPO: ${{ needs.meta.outputs.proto_repo }}
          LANGS: ${{ needs.meta.outputs.langs }}
          PROTO_DIR: proto-src
          ARTIFACTS: artifacts
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/publish.sh

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: result
          path: result/result.json
          if-no-files-found: ignore
          retention-days: 30

  # Internal Maven publish (GitHub Packages) for the JVM languages. Runs after `publish`
  # has tagged: only a language that was generated, merged and tagged is published, and
  # each language is independent (a failure here never affects the other one).
  publish-maven:
    name: publish maven (${{ matrix.lang }})
    needs: [meta, publish]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        lang: [java, scala]
    env:
      LANG_NAME: ${{ matrix.lang }}
      PROTO_REF: ${{ needs.meta.outputs.proto_ref }}
      # setup-java (java) and build.sbt (scala) read these for the registry credentials.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download publish result
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: result
          path: result

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          status=""
          if [ -f result/result.json ]; then
            status="$(jq -r --arg l "${LANG_NAME}" '.langs[$l].status // empty' result/result.json)"
          fi
          case "${status}" in
            success|exists) echo "publish=true" >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              echo "### maven ${LANG_NAME}: skipped (stubs result: ${status:-none})" >> "${GITHUB_STEP_SUMMARY}"
              ;;
          esac

      # The tag was created by `publish` on the merge commit.
      - uses: actions/checkout@v5
        if: steps.decide.outputs.publish == 'true'
        with:
          ref: refs/tags/${{ matrix.lang }}/${{ needs.meta.outputs.proto_ref }}

      - uses: huponx/actions/.github/actions/lang-setup@v1
        if: steps.decide.outputs.publish == 'true'
        with:
          lang: ${{ matrix.lang }}
          root: ${{ matrix.lang }}

      # Registry settings are passed on the command line, so a tag created before this
      # existed (or any later edit of pom.xml/build.sbt) can still be published.
      - name: Deploy
        if: steps.decide.outputs.publish == 'true'
        env:
          REGISTRY: https://maven.pkg.github.com/${{ github.repository }}
        run: |
          set -uo pipefail
          version="${PROTO_REF#v}"
          set +e
          if [ "${LANG_NAME}" = "java" ]; then
            mvn -B -f java/pom.xml -Drevision="${version}" \
              -DaltDeploymentRepository="github::${REGISTRY}" deploy 2>&1 | tee deploy.log
          else
            (cd scala && PROTOGEN_VERSION="${version}" sbt -batch \
              "set ThisBuild / publishMavenStyle := true" \
              "set ThisBuild / publishTo := Some(\"GitHub Package Registry\" at \"${REGISTRY}\")" \
              "set ThisBuild / credentials += Credentials(\"GitHub Package Registry\", \"maven.pkg.github.com\", sys.env(\"GITHUB_ACTOR\"), sys.env(\"GITHUB_TOKEN\"))" \
              "set Compile / packageDoc / publishArtifact := false" \
              publish) 2>&1 | tee deploy.log
          fi
          rc="${PIPESTATUS[0]}"
          set -e
          coords="com.huponx.protogen:protogen-${LANG_NAME}:${version}"
          if [ "${rc}" -eq 0 ]; then
            echo "### maven ${LANG_NAME}: published \`${coords}\`" >> "${GITHUB_STEP_SUMMARY}"
          elif grep -qiE 'conflict|already exists|status code: 409|409' deploy.log; then
            # GitHub Packages never overwrites a version: a re-run for the same tag is fine.
            echo "### maven ${LANG_NAME}: \`${coords}\` already published (not overwritten)" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### maven ${LANG_NAME}: FAILED" >> "${GITHUB_STEP_SUMMARY}"
            echo "::error title=maven ${LANG_NAME}::deploy of ${coords} failed; see the log"
            exit 1
          fi
